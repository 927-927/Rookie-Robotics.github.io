<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 730" width="1100" height="730">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#5b6770"/>
</marker>
</defs>
<style>
text { font-family: Roboto, Helvetica, Arial, sans-serif; fill: #1f2a33; }
.mono, .mono text { font-family: "Roboto Mono", Consolas, Menlo, monospace; }
.label { font-size: 16px; font-weight: bold; fill: #5b6770; letter-spacing: 2px; }
.muted, .muted text { fill: #5b6770; }
.band { fill: #f3f5f7; stroke: #cfd8dc; stroke-width: 2; }
.cell { fill: #ffffff; stroke: #8796a5; stroke-width: 2; }
.caption { font-size: 12px; font-weight: bold; fill: #5b6770; letter-spacing: 1.5px; text-anchor: middle; }
.value { font-family: "Roboto Mono", Consolas, Menlo, monospace; font-size: 16px; font-weight: bold; text-anchor: middle; }
.flow { fill: none; stroke: #5b6770; stroke-width: 2.5; }
</style>
<rect width="1100" height="730" rx="16" fill="#ffffff"/>

<!-- Trigger -->
<rect x="40" y="28" width="290" height="100" rx="12" fill="#fff6d6" stroke="#c9a400" stroke-width="2"/>
<text x="185" y="58" text-anchor="middle" class="label" style="fill:#8a6d00">TRIGGER</text>
<text x="185" y="86" text-anchor="middle" class="mono" font-size="18" font-weight="bold">rightBumper()</text>
<text x="185" y="110" text-anchor="middle" font-size="16">the driver presses RB</text>

<line x1="332" y1="78" x2="414" y2="78" stroke="#5b6770" stroke-width="3" marker-end="url(#arrow)"/>
<text x="373" y="66" text-anchor="middle" class="mono" font-size="16" font-weight="bold">onTrue</text>

<!-- Command -->
<rect x="420" y="28" width="400" height="100" rx="12" fill="#dfeafb" stroke="#2f6fb5" stroke-width="2"/>
<text x="620" y="58" text-anchor="middle" class="label" style="fill:#245a94">COMMAND</text>
<text x="620" y="86" text-anchor="middle" class="mono" font-size="16" font-weight="bold">setWantedStateCommand(SCORE_ON_MOVE)</text>
<text x="620" y="110" text-anchor="middle" font-size="15"><tspan class="mono">runOnce</tspan>: sets one variable, then ends</text>

<text x="845" y="70" font-size="15" class="muted">Releasing RB runs <tspan class="mono">onFalse</tspan>,</text>
<text x="845" y="92" font-size="15" class="muted">which sets <tspan class="mono">DEFAULT_STATE</tspan></text>

<path d="M620,130 V150 H365 V186" class="flow" marker-end="url(#arrow)"/>

<!-- SuperStructure -->
<rect x="40" y="170" width="1020" height="100" rx="12" class="band"/>
<text x="60" y="212" class="label">SUPERSTRUCTURE</text>
<text x="60" y="238" font-size="15" class="muted"><tspan class="mono">periodic()</tspan>, every loop</text>
<rect x="250" y="190" width="230" height="60" rx="8" class="cell"/>
<text x="365" y="212" class="caption">WANTED STATE</text>
<text x="365" y="238" class="value">SCORE_ON_MOVE</text>
<line x1="482" y1="220" x2="511" y2="220" stroke="#5b6770" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="515" y="190" width="230" height="60" rx="8" class="cell"/>
<text x="630" y="212" class="caption">CURRENT STATE</text>
<text x="630" y="238" class="value">SCORING_ON_THE_MOVE</text>
<line x1="747" y1="220" x2="776" y2="220" stroke="#5b6770" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="780" y="190" width="260" height="60" rx="8" class="cell"/>
<text x="910" y="212" class="caption">APPLY STATE</text>
<text x="910" y="238" class="value">scoringOnTheMove()</text>

<path d="M910,252 V300 H365 V346" class="flow" marker-end="url(#arrow)"/>
<text x="640" y="292" text-anchor="middle" class="mono" font-size="15">shooterSubsystem.setWantedState(RUN)</text>

<!-- Shooter -->
<rect x="40" y="330" width="1020" height="100" rx="12" class="band"/>
<text x="60" y="372" class="label">SHOOTER</text>
<text x="60" y="398" font-size="15" class="muted"><tspan class="mono">periodic()</tspan>, every loop</text>
<rect x="250" y="350" width="230" height="60" rx="8" class="cell"/>
<text x="365" y="372" class="caption">WANTED STATE</text>
<text x="365" y="398" class="value">RUN</text>
<line x1="482" y1="380" x2="511" y2="380" stroke="#5b6770" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="515" y="350" width="230" height="60" rx="8" class="cell"/>
<text x="630" y="372" class="caption">SYSTEM STATE</text>
<text x="630" y="398" class="value">RUNNING</text>
<line x1="747" y1="380" x2="776" y2="380" stroke="#5b6770" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="780" y="350" width="260" height="60" rx="8" class="cell"/>
<text x="910" y="372" class="caption">APPLY STATE</text>
<text x="910" y="398" class="value">applyStates()</text>

<path d="M910,412 V460 H365 V506" class="flow" marker-end="url(#arrow)"/>
<text x="640" y="452" text-anchor="middle" class="mono" font-size="15">hood.setWantedState(HOLD_POSITION)</text>

<!-- Hood -->
<rect x="40" y="490" width="1020" height="100" rx="12" class="band"/>
<text x="60" y="532" class="label">HOOD</text>
<text x="60" y="558" font-size="15" class="muted"><tspan class="mono">periodic()</tspan>, every loop</text>
<rect x="250" y="510" width="230" height="60" rx="8" class="cell"/>
<text x="365" y="532" class="caption">WANTED STATE</text>
<text x="365" y="558" class="value">HOLD_POSITION</text>
<line x1="482" y1="540" x2="511" y2="540" stroke="#5b6770" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="515" y="510" width="230" height="60" rx="8" class="cell"/>
<text x="630" y="532" class="caption">SYSTEM STATE</text>
<text x="630" y="558" class="value">HOLDING_POSITION</text>
<line x1="747" y1="540" x2="776" y2="540" stroke="#5b6770" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="780" y="510" width="260" height="60" rx="8" class="cell"/>
<text x="910" y="532" class="caption">APPLY STATE</text>
<text x="910" y="558" class="value">applyStates()</text>

<path d="M910,572 V624" class="flow" marker-end="url(#arrow)"/>
<text x="896" y="606" text-anchor="end" class="mono" font-size="15">setMotionMagicSetpoint(angle)</text>

<!-- Motor -->
<rect x="780" y="630" width="260" height="70" rx="12" fill="#37474f"/>
<text x="910" y="658" text-anchor="middle" class="label" style="fill:#ffffff">TALONFX</text>
<text x="910" y="684" text-anchor="middle" font-size="16" style="fill:#cfd8dc">the hood moves to the angle</text>
</svg>
