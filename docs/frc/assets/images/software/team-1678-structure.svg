<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" width="1100" height="540">
<defs>
<marker id="arrow-light" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#8796a5"/>
</marker>
</defs>
<style>
text { font-family: Roboto, Helvetica, Arial, sans-serif; fill: #1f2a33; }
.mono, .mono text { font-family: "Roboto Mono", Consolas, Menlo, monospace; }
.label { font-size: 15px; font-weight: bold; fill: #5b6770; letter-spacing: 2px; }
.muted, .muted text { fill: #5b6770; }
.group { fill: #f5f7f8; stroke: #cfd8dc; stroke-width: 1.5; stroke-dasharray: 6 4; }
.box-plain { fill: #ffffff; stroke: #607d8b; stroke-width: 2; }
.box-flywheel { fill: #ffffff; stroke: #2e9d43; stroke-width: 2; }
.box-servo { fill: #ffffff; stroke: #2f6fb5; stroke-width: 2; }
.name { font-family: "Roboto Mono", Consolas, Menlo, monospace; font-size: 14px; font-weight: bold; text-anchor: middle; }
.base { font-size: 14px; text-anchor: middle; }
.extra { font-size: 14px; text-anchor: middle; fill: #5b6770; }
.chip text { font-size: 14px; text-anchor: middle; }
.plain rect { fill: #e3e9ed; stroke: #607d8b; stroke-width: 1.5; }
.plain text { fill: #37474f; }
.flywheel rect { fill: #e0f2e4; stroke: #2e9d43; stroke-width: 1.5; }
.flywheel text { fill: #1b6a2b; }
.servo rect { fill: #dfeafb; stroke: #2f6fb5; stroke-width: 1.5; }
.servo text { fill: #245a94; }
.link { stroke: #8796a5; stroke-width: 2; stroke-dasharray: 5 4; }
</style>
<rect width="1100" height="540" rx="16" fill="#ffffff"/>

<!-- Superstructure -->
<rect x="40" y="28" width="280" height="300" rx="12" fill="#37474f"/>
<text x="180" y="64" text-anchor="middle" class="label" style="fill:#ffffff;font-size:17px">SUPERSTRUCTURE</text>
<text x="180" y="92" text-anchor="middle" font-size="15" style="fill:#cfd8dc">no motors of its own</text>
<text x="180" y="114" text-anchor="middle" font-size="15" style="fill:#cfd8dc">about 50 commands, like:</text>
<text x="180" y="146" text-anchor="middle" class="mono" font-size="15" style="fill:#ffffff">intake()</text>
<text x="180" y="170" text-anchor="middle" class="mono" font-size="15" style="fill:#ffffff">shoot()</text>
<text x="180" y="194" text-anchor="middle" class="mono" font-size="15" style="fill:#ffffff">tuck()</text>
<text x="180" y="218" text-anchor="middle" class="mono" font-size="15" style="fill:#ffffff">fenderShot()</text>
<text x="180" y="242" text-anchor="middle" class="mono" font-size="15" style="fill:#ffffff">idle()</text>
<text x="180" y="278" text-anchor="middle" font-size="15" style="fill:#cfd8dc">each one gives setpoints</text>
<text x="180" y="300" text-anchor="middle" font-size="15" style="fill:#cfd8dc">to the subsystems it needs</text>

<!-- Shooting -->
<line x1="180" y1="364" x2="180" y2="332" class="link" marker-end="url(#arrow-light)"/>
<text x="192" y="353" font-size="14" class="muted">latest setpoints</text>
<rect x="40" y="366" width="280" height="110" rx="12" fill="#ffffff" stroke="#8796a5" stroke-width="2" stroke-dasharray="6 4"/>
<text x="180" y="398" text-anchor="middle" class="mono" font-size="16" font-weight="bold">Shooting</text>
<text x="180" y="422" text-anchor="middle" font-size="14" class="muted">a plain class, not a subsystem</text>
<text x="180" y="444" text-anchor="middle" font-size="14" class="muted">works out the shot</text>

<!-- Arrows to the subsystems -->
<line x1="322" y1="121" x2="396" y2="121" class="link" marker-end="url(#arrow-light)"/>
<text x="359" y="111" text-anchor="middle" font-size="14" class="muted">setpoints</text>
<line x1="322" y1="291" x2="396" y2="291" class="link" marker-end="url(#arrow-light)"/>
<text x="359" y="281" text-anchor="middle" font-size="14" class="muted">setpoints</text>

<!-- Row A: the intake -->
<text x="400" y="56" class="label">THE INTAKE</text>
<rect x="400" y="66" width="314" height="110" rx="12" class="group"/>
<rect x="410" y="80" width="142" height="82" rx="10" class="box-servo"/>
<text x="481" y="108" class="name">IntakeDeploy</text>
<text x="481" y="130" class="base" style="fill:#245a94">servo</text>
<text x="481" y="150" class="extra">the arm</text>
<rect x="562" y="80" width="142" height="82" rx="10" class="box-plain"/>
<text x="633" y="108" class="name">IntakeRollers</text>
<text x="633" y="130" class="base" style="fill:#37474f">MotorSubsystem</text>
<text x="633" y="150" class="extra">+ followers</text>

<!-- Row A: the shooter -->
<text x="746" y="56" class="label">THE SHOOTER</text>
<rect x="746" y="66" width="314" height="110" rx="12" class="group"/>
<rect x="756" y="80" width="142" height="82" rx="10" class="box-flywheel"/>
<text x="827" y="108" class="name">Shooter</text>
<text x="827" y="130" class="base" style="fill:#1b6a2b">flywheel</text>
<text x="827" y="150" class="extra">+ followers</text>
<rect x="908" y="80" width="142" height="82" rx="10" class="box-servo"/>
<text x="979" y="108" class="name">Hood</text>
<text x="979" y="130" class="base" style="fill:#245a94">servo</text>
<text x="979" y="150" class="extra">the shot angle</text>

<!-- Row B: moving fuel to the shooter -->
<text x="400" y="226" class="label">MOVING FUEL TO THE SHOOTER</text>
<rect x="400" y="236" width="466" height="110" rx="12" class="group"/>
<rect x="410" y="250" width="142" height="82" rx="10" class="box-plain"/>
<text x="481" y="278" class="name">HopperRollers</text>
<text x="481" y="300" class="base" style="fill:#37474f">MotorSubsystem</text>
<rect x="562" y="250" width="142" height="82" rx="10" class="box-flywheel"/>
<text x="633" y="278" class="name">TunnelRollers</text>
<text x="633" y="300" class="base" style="fill:#1b6a2b">flywheel</text>
<text x="633" y="320" class="extra">+ followers</text>
<rect x="714" y="250" width="142" height="82" rx="10" class="box-plain"/>
<text x="785" y="278" class="name">FeederRollers</text>
<text x="785" y="300" class="base" style="fill:#37474f">MotorSubsystem</text>

<!-- Row B: climber -->
<text x="898" y="226" class="label">CLIMBER</text>
<rect x="898" y="236" width="162" height="110" rx="12" class="group"/>
<rect x="908" y="250" width="142" height="82" rx="10" class="box-servo"/>
<text x="979" y="278" class="name">Climber</text>
<text x="979" y="300" class="base" style="fill:#245a94">servo</text>

<!-- Legend -->
<text x="400" y="392" class="label">BASE CLASSES</text>
<g class="chip servo"><rect x="400" y="406" width="140" height="26" rx="13"/><text x="470" y="424">servo</text></g>
<text x="556" y="424" font-size="15"><tspan class="mono" font-size="14">ServoMotorSubsystem</tspan>: moves to a position</text>
<g class="chip flywheel"><rect x="400" y="442" width="140" height="26" rx="13"/><text x="470" y="460">flywheel</text></g>
<text x="556" y="460" font-size="15"><tspan class="mono" font-size="14">FlywheelMotorSubsystem</tspan>: spins at a set speed</text>
<g class="chip plain mono"><rect x="400" y="478" width="140" height="26" rx="13"/><text x="470" y="496">MotorSubsystem</text></g>
<text x="556" y="496" font-size="15">the shared parent, used on its own: just runs the motor</text>

<text x="40" y="508" font-size="14" class="muted">Not shown: Drive, LEDs and Cameras.</text>
</svg>
