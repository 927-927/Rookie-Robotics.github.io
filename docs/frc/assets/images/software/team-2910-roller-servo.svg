<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 412" width="1100" height="412">
<defs>
<marker id="spin" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#2e9d43"/>
</marker>
<marker id="range" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#2f6fb5"/>
</marker>
</defs>
<style>
text { font-family: Roboto, Helvetica, Arial, sans-serif; fill: #1f2a33; }
.mono, .mono text { font-family: "Roboto Mono", Consolas, Menlo, monospace; }
.label { font-size: 17px; font-weight: bold; letter-spacing: 2px; text-anchor: middle; }
.muted, .muted text { fill: #5b6770; }
.chip text { font-size: 15px; text-anchor: middle; }
.chip-roller rect { fill: #e0f2e4; stroke: #2e9d43; stroke-width: 1.5; }
.chip-roller text { fill: #1b6a2b; }
.chip-servo rect { fill: #dfeafb; stroke: #2f6fb5; stroke-width: 1.5; }
.chip-servo text { fill: #245a94; }
.chip-both rect { fill: #eceff1; stroke: #90a4ae; stroke-width: 1.5; }
.chip-both text { fill: #455a64; }
.fuel { fill: #ffd54f; stroke: #c9a400; stroke-width: 2; }
</style>
<rect width="1100" height="412" rx="16" fill="#ffffff"/>

<!-- ============ Roller ============ -->
<rect x="40" y="28" width="490" height="356" rx="14" fill="#f4fbf5" stroke="#2e9d43" stroke-width="2"/>
<text x="285" y="62" class="label" style="fill:#1b6a2b">ROLLER</text>

<!-- speed lines and fuel -->
<line x1="92" y1="186" x2="126" y2="186" stroke="#c9a400" stroke-width="3" stroke-linecap="round"/>
<line x1="100" y1="200" x2="128" y2="200" stroke="#c9a400" stroke-width="3" stroke-linecap="round"/>
<line x1="96" y1="214" x2="124" y2="214" stroke="#c9a400" stroke-width="3" stroke-linecap="round"/>
<circle cx="164" cy="200" r="20" class="fuel"/>
<circle cx="214" cy="194" r="20" class="fuel"/>

<!-- roller wheel -->
<circle cx="285" cy="150" r="50" fill="#ffffff" stroke="#1f2a33" stroke-width="3"/>
<g stroke="#2e9d43" stroke-width="5" stroke-linecap="round">
<line x1="285" y1="138" x2="285" y2="104"/>
<line x1="295.4" y1="156" x2="324.8" y2="173"/>
<line x1="274.6" y1="156" x2="245.2" y2="173"/>
</g>
<g stroke="#8fd19e" stroke-width="5" stroke-linecap="round">
<line x1="295.4" y1="144" x2="324.8" y2="127"/>
<line x1="285" y1="162" x2="285" y2="196"/>
<line x1="274.6" y1="144" x2="245.2" y2="127"/>
</g>
<circle cx="285" cy="150" r="11" fill="#5b6770"/>
<path d="M221.6,126.9 A68,68 0 0 1 348.4,126.9" fill="none" stroke="#2e9d43" stroke-width="5" stroke-linecap="round" marker-end="url(#spin)"/>
<path d="M348.4,173.1 A68,68 0 0 1 327,203.5" fill="none" stroke="#2e9d43" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 10"/>
<text x="400" y="118" font-size="15" class="muted">keeps</text>
<text x="400" y="138" font-size="15" class="muted">spinning,</text>
<text x="400" y="158" font-size="15" class="muted">no end</text>
<text x="400" y="178" font-size="15" class="muted">point</text>

<text x="285" y="268" text-anchor="middle" font-size="18" font-weight="bold">spins, with no min or max position</text>
<g class="chip chip-roller"><rect x="136" y="284" width="90" height="28" rx="14"/><text x="181" y="303">velocity</text></g>
<g class="chip chip-both"><rect x="238" y="284" width="100" height="28" rx="14"/><text x="288" y="303">duty cycle</text></g>
<g class="chip chip-both"><rect x="350" y="284" width="85" height="28" rx="14"/><text x="392.5" y="303">voltage</text></g>
<text x="285" y="342" text-anchor="middle" font-size="15" class="muted">coast when stopped · no soft limits</text>
<text x="285" y="364" text-anchor="middle" font-size="15" class="muted">used for: intake rollers, hopper, flywheel</text>

<!-- ============ Servo ============ -->
<rect x="570" y="28" width="490" height="356" rx="14" fill="#f3f7fd" stroke="#2f6fb5" stroke-width="2"/>
<text x="815" y="62" class="label" style="fill:#245a94">SERVO</text>

<!-- ground and mount -->
<line x1="640" y1="245" x2="960" y2="245" stroke="#90a4ae" stroke-width="3" stroke-linecap="round"/>
<rect x="702" y="215" width="36" height="30" rx="4" fill="#cfd8dc"/>

<!-- hard stop -->
<rect x="706" y="108" width="14" height="40" rx="3" fill="#455a64"/>
<text x="698" y="126" text-anchor="end" font-size="15" class="muted">hard</text>
<text x="698" y="145" text-anchor="end" font-size="15" class="muted">stop</text>

<!-- range arc -->
<path d="M744.3,77.1 A140,140 0 0 1 859.5,202.8" fill="none" stroke="#2f6fb5" stroke-width="2.5" stroke-dasharray="6 6" marker-start="url(#range)" marker-end="url(#range)"/>
<text x="734" y="80" text-anchor="end" font-size="15" font-weight="bold" style="fill:#245a94">min</text>
<text x="872" y="206" font-size="15" font-weight="bold" style="fill:#245a94">max</text>

<!-- ghost arms at min and max, arm in between -->
<line x1="720" y1="215" x2="740.8" y2="96.8" stroke="#2f6fb5" stroke-width="18" stroke-linecap="round" opacity="0.18"/>
<line x1="720" y1="215" x2="839.5" y2="204.5" stroke="#2f6fb5" stroke-width="18" stroke-linecap="round" opacity="0.18"/>
<line x1="720" y1="215" x2="811.9" y2="137.9" stroke="#2f6fb5" stroke-width="18" stroke-linecap="round"/>
<circle cx="720" cy="215" r="12" fill="#ffffff" stroke="#1f2a33" stroke-width="3"/>
<text x="905" y="138" font-size="15" class="muted">stops at a</text>
<text x="905" y="158" font-size="15" class="muted">position</text>

<text x="815" y="268" text-anchor="middle" font-size="18" font-weight="bold">moves to a position between a min and a max</text>
<g class="chip chip-servo"><rect x="600" y="284" width="90" height="28" rx="14"/><text x="645" y="303">position</text></g>
<g class="chip chip-servo"><rect x="702" y="284" width="120" height="28" rx="14"/><text x="762" y="303">Motion Magic</text></g>
<g class="chip chip-both"><rect x="834" y="284" width="100" height="28" rx="14"/><text x="884" y="303">duty cycle</text></g>
<g class="chip chip-both"><rect x="946" y="284" width="85" height="28" rx="14"/><text x="988.5" y="303">voltage</text></g>
<text x="815" y="342" text-anchor="middle" font-size="15" class="muted">brake when stopped · soft limits at min and max · can home</text>
<text x="815" y="364" text-anchor="middle" font-size="15" class="muted">used for: intake arm, hood</text>
</svg>
