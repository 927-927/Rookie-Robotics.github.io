<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="1100" height="470">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#5b6770"/>
</marker>
</defs>
<style>
text { font-family: Roboto, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", Helvetica, Arial, sans-serif; fill: #1f2a33; }
.mono, .mono text { font-family: "Roboto Mono", Consolas, Menlo, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", monospace; }
.label { font-size: 17px; font-weight: bold; fill: #5b6770; letter-spacing: 2px; }
.muted, .muted text { fill: #5b6770; }
.kw { fill: #2f6fb5; }
</style>
<rect width="1100" height="470" rx="16" fill="#ffffff"/>

<!-- Time-based: your code inside the loop -->
<text x="300" y="50" text-anchor="middle" class="label">基于时间</text>
<path d="M110,330 H84 Q70,330 70,316 V134 Q70,120 84,120 H104" fill="none" stroke="#5b6770" stroke-width="3" marker-end="url(#arrow)"/>
<text transform="translate(54,225) rotate(-90)" text-anchor="middle" font-size="17" font-weight="bold" class="muted">每 20 ms</text>
<rect x="110" y="80" width="380" height="290" rx="12" fill="#e8eef3" stroke="#8796a5" stroke-width="2"/>
<text x="132" y="118" class="mono" font-size="21" font-weight="bold">teleopPeriodic()</text>
<rect x="128" y="136" width="344" height="214" rx="8" fill="#ffffff" stroke="#c5d0da" stroke-width="1.5"/>
<g class="mono" font-size="18">
<text x="144" y="168"><tspan class="kw">if</tspan> (按下 A)</text><text x="330" y="168">吸取机构 开</text>
<text x="144" y="196" class="kw">else</text><text x="330" y="196">吸取机构 关</text>
<text x="144" y="224"><tspan class="kw">if</tspan> (按下 B)</text><text x="330" y="224">发射机构 开</text>
<text x="144" y="252" class="kw">else</text><text x="330" y="252">发射机构 关</text>
<text x="144" y="280"><tspan class="kw">if</tspan> (正在射击 &amp;&amp;</text>
<text x="176" y="308">计时器 &gt; 0.5)</text><text x="330" y="308">送料机构 开</text>
<text x="144" y="336" class="muted">...</text>
</g>
<text x="300" y="414" text-anchor="middle" font-size="19">每个机构的每一项检查都要你自己写，</text>
<text x="300" y="440" text-anchor="middle" font-size="19">全都写在每次循环都运行的这一个方法里。</text>

<!-- Command-based: the scheduler inside the loop -->
<text x="845" y="50" text-anchor="middle" class="label">基于命令</text>
<path d="M620,330 H594 Q580,330 580,316 V134 Q580,120 594,120 H614" fill="none" stroke="#5b6770" stroke-width="3" marker-end="url(#arrow)"/>
<text transform="translate(564,225) rotate(-90)" text-anchor="middle" font-size="17" font-weight="bold" class="muted">每 20 ms</text>
<rect x="620" y="80" width="450" height="290" rx="12" fill="#e8eef3" stroke="#8796a5" stroke-width="2"/>
<text x="642" y="118" class="mono" font-size="21" font-weight="bold">robotPeriodic()</text>
<rect x="638" y="136" width="414" height="214" rx="8" fill="#ffffff" stroke="#c5d0da" stroke-width="1.5"/>
<path d="M646,136 H1044 Q1052,136 1052,144 V180 H638 V144 Q638,136 646,136 Z" fill="#37474f"/>
<text x="845" y="164" text-anchor="middle" class="mono" font-size="17" font-weight="bold" style="fill:#ffffff">CommandScheduler.getInstance().run()</text>
<g font-size="17">
<circle cx="664" cy="211" r="13" fill="#37474f"/><text x="664" y="216" text-anchor="middle" font-size="15" font-weight="bold" style="fill:#ffffff">1</text>
<text x="686" y="217">运行每个子系统的 <tspan class="mono">periodic()</tspan></text>
<circle cx="664" cy="247" r="13" fill="#37474f"/><text x="664" y="252" text-anchor="middle" font-size="15" font-weight="bold" style="fill:#ffffff">2</text>
<text x="686" y="253">检查触发器：启动或取消命令</text>
<circle cx="664" cy="283" r="13" fill="#37474f"/><text x="664" y="288" text-anchor="middle" font-size="15" font-weight="bold" style="fill:#ffffff">3</text>
<text x="686" y="289">把每个正在运行的命令执行一步</text>
<circle cx="664" cy="319" r="13" fill="#37474f"/><text x="664" y="324" text-anchor="middle" font-size="15" font-weight="bold" style="fill:#ffffff">4</text>
<text x="686" y="325">在空闲的子系统上启动默认命令</text>
</g>
<text x="845" y="414" text-anchor="middle" font-size="19">你只需要写子系统、命令和绑定。</text>
<text x="845" y="440" text-anchor="middle" font-size="19">每次循环运行什么，由调度器决定。</text>
</svg>
