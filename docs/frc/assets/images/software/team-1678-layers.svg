<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1102" width="1100" height="1102">
<defs>
<marker id="arrow-light" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#8796a5"/>
</marker>
<marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
</marker>
</defs>
<style>
text { font-family: Roboto, Helvetica, Arial, sans-serif; fill: #1f2a33; }
.mono, .mono text { font-family: "Roboto Mono", Consolas, Menlo, monospace; }
.label { font-size: 16px; font-weight: bold; fill: #5b6770; letter-spacing: 2px; }
.muted, .muted text { fill: #5b6770; }
.band { fill: #f5f7f8; }
.badge circle { fill: #37474f; }
.badge text { fill: #ffffff; font-size: 15px; font-weight: bold; text-anchor: middle; }
.box { fill: #ffffff; stroke: #8796a5; stroke-width: 2; }
.box-plain { fill: #ffffff; stroke: #607d8b; stroke-width: 2; }
.box-flywheel { fill: #ffffff; stroke: #2e9d43; stroke-width: 2; }
.box-servo { fill: #ffffff; stroke: #2f6fb5; stroke-width: 2; }
.group-plain { fill: #f1f4f6; stroke: #607d8b; stroke-width: 2; }
.group-flywheel { fill: #f4fbf5; stroke: #2e9d43; stroke-width: 2; }
.group-servo { fill: #f3f7fd; stroke: #2f6fb5; stroke-width: 2; }
.hardware { fill: #eceff1; stroke: #90a4ae; stroke-width: 1.5; }
.chip text { font-size: 14px; text-anchor: middle; }
.plain rect { fill: #e3e9ed; stroke: #607d8b; stroke-width: 1.5; }
.plain text { fill: #37474f; }
.servo rect { fill: #dfeafb; stroke: #2f6fb5; stroke-width: 1.5; }
.servo text { fill: #245a94; }
.ctre rect { fill: #eceff1; stroke: #90a4ae; stroke-width: 1.5; }
.ctre text { fill: #455a64; }
.link { stroke: #8796a5; stroke-width: 2; stroke-dasharray: 5 4; }
.call { stroke: #37474f; stroke-width: 2.5; }
.step { font-size: 14px; }
</style>
<rect width="1100" height="1102" rx="16" fill="#ffffff"/>

<!-- Column headings -->
<text x="60" y="50" class="label">THE LAYERS</text>
<text x="800" y="50" class="label">FOLLOWING THE HOOD</text>
<line x1="785" y1="30" x2="785" y2="1074" stroke="#cfd8dc" stroke-width="2" stroke-dasharray="4 6"/>

<!-- ============ 1: Robot subsystems ============ -->
<rect x="40" y="68" width="1020" height="128" rx="12" class="band"/>
<g class="badge"><circle cx="74" cy="97" r="13"/><text x="74" y="102">1</text></g>
<text x="96" y="103" class="label">ROBOT SUBSYSTEMS</text>
<text x="314" y="103" font-size="15" class="muted">only named setpoints and a constructor, about 20 lines</text>

<rect x="60" y="118" width="165" height="62" rx="10" class="box-plain"/>
<text x="142.5" y="144" text-anchor="middle" class="mono" font-size="14" font-weight="bold">HopperRollers</text>
<text x="142.5" y="167" text-anchor="middle" font-size="14" style="fill:#37474f">extends the parent</text>

<rect x="241" y="118" width="165" height="62" rx="10" class="box-flywheel"/>
<text x="323.5" y="144" text-anchor="middle" class="mono" font-size="14" font-weight="bold">Shooter</text>
<text x="323.5" y="167" text-anchor="middle" font-size="14" style="fill:#1b6a2b">extends flywheel</text>

<rect x="422" y="118" width="165" height="62" rx="10" class="box-servo"/>
<text x="504.5" y="144" text-anchor="middle" class="mono" font-size="14" font-weight="bold">IntakeDeploy</text>
<text x="504.5" y="167" text-anchor="middle" font-size="14" style="fill:#245a94">extends servo</text>

<rect x="603" y="118" width="165" height="62" rx="10" class="box-servo"/>
<text x="685.5" y="144" text-anchor="middle" class="mono" font-size="14" font-weight="bold">Hood</text>
<text x="685.5" y="167" text-anchor="middle" font-size="14" style="fill:#245a94">extends servo</text>

<text x="800" y="104" class="mono step" font-weight="bold">Hood</text>
<text x="800" y="128" class="step muted"><tspan class="mono">Hood.STOW</tspan> is a named Setpoint.</text>
<text x="800" y="150" class="step muted">A command asks for it:</text>
<text x="800" y="174" class="mono step">setpointCommand(Hood.STOW)</text>

<!-- 1 to 2 -->
<line x1="233.5" y1="198" x2="233.5" y2="232" class="link" marker-end="url(#arrow-light)"/>
<line x1="596.5" y1="198" x2="596.5" y2="232" class="link" marker-end="url(#arrow-light)"/>
<text x="415" y="221" text-anchor="middle" class="mono muted" font-size="15">extends</text>
<line x1="925" y1="198" x2="925" y2="232" class="call" marker-end="url(#arrow-dark)"/>

<!-- ============ 2: Base classes ============ -->
<rect x="40" y="236" width="1020" height="284" rx="12" class="band"/>
<g class="badge"><circle cx="74" cy="265" r="13"/><text x="74" y="270">2</text></g>
<text x="96" y="271" class="label">BASE CLASSES</text>
<text x="258" y="271" font-size="15" class="muted">in <tspan class="mono" font-size="14">frc/lib/bases</tspan>: one shared parent, and a child for each kind</text>

<rect x="60" y="286" width="347" height="96" rx="12" class="group-flywheel"/>
<text x="233.5" y="312" text-anchor="middle" class="mono" font-size="15" font-weight="bold">FlywheelMotorSubsystem</text>
<text x="233.5" y="336" text-anchor="middle" font-size="14" class="muted">adds <tspan class="mono">nearVelocity()</tspan></text>
<text x="233.5" y="358" text-anchor="middle" font-size="14" class="muted">and a spun-up check</text>

<rect x="423" y="286" width="347" height="96" rx="12" class="group-servo"/>
<text x="596.5" y="312" text-anchor="middle" class="mono" font-size="15" font-weight="bold">ServoMotorSubsystem</text>
<text x="596.5" y="336" text-anchor="middle" font-size="14" class="muted">adds <tspan class="mono">nearPosition()</tspan>, homing, soft limits</text>
<g class="chip servo mono"><rect x="471" y="348" width="251" height="26" rx="13"/><text x="596.5" y="366">+ CoupledServoMotorSubsystem</text></g>

<line x1="233.5" y1="384" x2="233.5" y2="408" class="link" marker-end="url(#arrow-light)"/>
<line x1="596.5" y1="384" x2="596.5" y2="408" class="link" marker-end="url(#arrow-light)"/>
<text x="415" y="401" text-anchor="middle" class="mono muted" font-size="15">extends</text>

<rect x="60" y="412" width="710" height="92" rx="12" class="group-plain"/>
<text x="415" y="438" text-anchor="middle" class="mono" font-size="15" font-weight="bold">MotorSubsystem</text>
<text x="415" y="460" text-anchor="middle" font-size="14" class="muted">the shared parent: holds the io, reads the sensors, live PID tuning</text>
<g class="chip plain mono"><rect x="131" y="470" width="142" height="26" rx="13"/><text x="202" y="488">applySetpoint()</text></g>
<g class="chip plain mono"><rect x="283" y="470" width="159" height="26" rx="13"/><text x="362.5" y="488">setpointCommand()</text></g>
<g class="chip plain mono"><rect x="452" y="470" width="209" height="26" rx="13"/><text x="556.5" y="488">followSetpointCommand()</text></g>
<text x="671" y="488" font-size="15" class="muted">…</text>

<text x="800" y="272" class="mono step" font-weight="bold">MotorSubsystem</text>
<text x="800" y="298" class="step muted"><tspan class="mono">setpointCommand()</tspan> is a</text>
<text x="800" y="320" class="step muted"><tspan class="mono">runOnce</tspan> that calls</text>
<text x="800" y="344" class="mono step">io.applySetpoint(STOW);</text>
<text x="800" y="370" class="step muted">and ends right away. The servo</text>
<text x="800" y="392" class="step muted">also updates its homing flags.</text>

<!-- 2 to 3 -->
<line x1="415" y1="522" x2="415" y2="556" class="link" marker-end="url(#arrow-light)"/>
<text x="430" y="545" font-size="15" class="muted">one <tspan class="mono">io</tspan>, held by the shared parent</text>
<line x1="925" y1="522" x2="925" y2="556" class="call" marker-end="url(#arrow-dark)"/>

<!-- ============ 3: MotorIO ============ -->
<rect x="40" y="560" width="1020" height="188" rx="12" class="band"/>
<g class="badge"><circle cx="74" cy="589" r="13"/><text x="74" y="594">3</text></g>
<text x="96" y="595" class="label">MOTOR IO</text>
<text x="207" y="595" font-size="15" class="muted">an abstract class, with the <tspan class="mono" font-size="14">Setpoint</tspan> class inside it</text>

<rect x="60" y="610" width="347" height="122" rx="12" class="box"/>
<text x="233.5" y="636" text-anchor="middle" class="mono" font-size="15" font-weight="bold">MotorIO</text>
<text x="233.5" y="658" text-anchor="middle" font-size="14" class="muted">remembers the current setpoint</text>
<g class="chip ctre mono"><rect x="129" y="670" width="209" height="26" rx="13"/><text x="233.5" y="688">applySetpoint(setpoint)</text></g>
<text x="233.5" y="718" text-anchor="middle" font-size="14" class="muted">the only public way to move the motor</text>

<rect x="423" y="610" width="347" height="122" rx="12" class="box"/>
<text x="596.5" y="636" text-anchor="middle" class="mono" font-size="15" font-weight="bold">Setpoint</text>
<text x="596.5" y="658" text-anchor="middle" font-size="14" class="muted">control mode + target + what to call</text>
<g class="chip ctre mono"><rect x="483.5" y="670" width="226" height="26" rx="13"/><text x="596.5" y="688">withMotionMagicSetpoint()</text></g>
<text x="596.5" y="718" text-anchor="middle" font-size="14" class="muted">one factory method for each mode</text>

<text x="800" y="596" class="mono step" font-weight="bold">MotorIO</text>
<text x="800" y="622" class="step muted">remembers <tspan class="mono">STOW</tspan>, then runs</text>
<text x="800" y="644" class="step muted">what <tspan class="mono">STOW</tspan> says to call:</text>
<text x="800" y="668" class="mono step">setMotionMagicSetpoint(</text>
<text x="800" y="688" class="mono step" xml:space="preserve">    kMinAngle);</text>

<!-- 3 to 4 -->
<line x1="233.5" y1="750" x2="233.5" y2="784" class="link" marker-end="url(#arrow-light)"/>
<line x1="596.5" y1="750" x2="596.5" y2="784" class="link" marker-end="url(#arrow-light)"/>
<text x="415" y="773" text-anchor="middle" font-size="15" class="muted">implemented by</text>
<line x1="925" y1="750" x2="925" y2="784" class="call" marker-end="url(#arrow-dark)"/>

<!-- ============ 4: IO implementations ============ -->
<rect x="40" y="788" width="1020" height="136" rx="12" class="band"/>
<g class="badge"><circle cx="74" cy="817" r="13"/><text x="74" y="822">4</text></g>
<text x="96" y="823" class="label">IO IMPLEMENTATIONS</text>
<text x="320" y="823" font-size="15" class="muted">picked in each constants file with <tspan class="mono" font-size="14">Robot.isReal()</tspan></text>

<rect x="60" y="838" width="347" height="66" rx="12" class="box"/>
<text x="233.5" y="865" text-anchor="middle" class="mono" font-size="15" font-weight="bold">MotorIOTalonFX</text>
<text x="233.5" y="889" text-anchor="middle" font-size="14" class="muted">on the robot · sets up the followers too</text>

<rect x="423" y="838" width="347" height="66" rx="12" class="box"/>
<text x="596.5" y="865" text-anchor="middle" class="mono" font-size="15" font-weight="bold">MotorIOTalonFXSim</text>
<text x="596.5" y="889" text-anchor="middle" font-size="14" class="muted">in simulation · extends MotorIOTalonFX</text>

<text x="800" y="824" class="mono step" font-weight="bold">MotorIOTalonFX</text>
<text x="800" y="850" class="mono step">setControl(requestGetter</text>
<text x="800" y="870" class="mono step" xml:space="preserve">  .getMotionMagicRequest(…));</text>
<text x="800" y="894" class="step muted">sends it to the main TalonFX</text>

<!-- 4 to 5 -->
<line x1="233.5" y1="926" x2="233.5" y2="960" class="link" marker-end="url(#arrow-light)"/>
<line x1="596.5" y1="926" x2="596.5" y2="960" class="link" marker-end="url(#arrow-light)"/>
<text x="415" y="949" text-anchor="middle" font-size="15" class="muted">drives</text>
<line x1="925" y1="926" x2="925" y2="960" class="call" marker-end="url(#arrow-dark)"/>

<!-- ============ 5: Hardware ============ -->
<rect x="40" y="964" width="1020" height="110" rx="12" class="band"/>
<g class="badge"><circle cx="74" cy="993" r="13"/><text x="74" y="998">5</text></g>
<text x="96" y="999" class="label">HARDWARE</text>
<text x="220" y="999" font-size="15" class="muted">what really moves, or a model of it in simulation</text>

<rect x="60" y="1014" width="347" height="46" rx="12" class="hardware"/>
<text x="233.5" y="1042" text-anchor="middle" font-size="15"><tspan class="mono" font-weight="bold">TalonFX</tspan>: the main motor + followers</text>

<rect x="423" y="1014" width="347" height="46" rx="12" class="hardware"/>
<text x="596.5" y="1042" text-anchor="middle" font-size="15"><tspan class="mono" font-weight="bold">PivotSim</tspan>, <tspan class="mono" font-weight="bold">RollerSim</tspan>: physics models</text>

<text x="800" y="1004" font-size="15" font-weight="bold">The TalonFX holds the hood</text>
<text x="800" y="1026" font-size="15" font-weight="bold">at the angle by itself, with</text>
<text x="800" y="1048" font-size="15" font-weight="bold">no loop in the robot code.</text>
</svg>
