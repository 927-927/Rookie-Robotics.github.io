<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="1100" height="480">
<defs>
<marker id="arrow-light" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#8796a5"/>
</marker>
</defs>
<style>
text { font-family: Roboto, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", Helvetica, Arial, sans-serif; fill: #1f2a33; }
.mono, .mono text { font-family: "Roboto Mono", Consolas, Menlo, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", monospace; }
.label { font-size: 16px; font-weight: bold; fill: #5b6770; letter-spacing: 2px; }
.muted, .muted text { fill: #5b6770; }
.box { fill: #f5f7f8; stroke: #8796a5; stroke-width: 2; }
.chip text { font-size: 14px; text-anchor: middle; }
.servo rect { fill: #dfeafb; stroke: #2f6fb5; stroke-width: 1.5; }
.servo text { fill: #245a94; }
.roller rect { fill: #e0f2e4; stroke: #2e9d43; stroke-width: 1.5; }
.roller text { fill: #1b6a2b; }
.plain rect { fill: #fff6d6; stroke: #c9a400; stroke-width: 1.5; }
.plain text { fill: #8a6d00; }
.ctre rect { fill: #eceff1; stroke: #90a4ae; stroke-width: 1.5; }
.ctre text { fill: #455a64; }
</style>
<rect width="1100" height="480" rx="16" fill="#ffffff"/>

<!-- SuperStructure -->
<rect x="40" y="28" width="1020" height="78" rx="12" fill="#37474f"/>
<text x="550" y="59" text-anchor="middle" class="label" style="fill:#ffffff;font-size:17px">上层结构（SUPERSTRUCTURE）</text>
<text x="550" y="88" text-anchor="middle" font-size="17" style="fill:#cfd8dc">整台机器人一个状态机 · 设置下面每个子系统的期望状态</text>

<line x1="125" y1="108" x2="125" y2="144" stroke="#8796a5" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-light)"/>
<line x1="345" y1="108" x2="345" y2="144" stroke="#8796a5" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-light)"/>
<line x1="580" y1="108" x2="580" y2="144" stroke="#8796a5" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-light)"/>
<line x1="880" y1="108" x2="880" y2="144" stroke="#8796a5" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-light)"/>
<text x="462" y="132" text-anchor="middle" class="mono muted" font-size="15">setWantedState()</text>

<!-- Swerve -->
<rect x="40" y="150" width="170" height="150" rx="12" class="box"/>
<text x="125" y="182" text-anchor="middle" class="mono" font-size="16" font-weight="bold">SwerveSubsystem</text>
<text x="125" y="206" text-anchor="middle" font-size="15" class="muted">底盘</text>
<g class="chip ctre"><rect x="55" y="222" width="140" height="26" rx="13"/><text x="125" y="240">CTRE swerve API</text></g>

<!-- Intake -->
<rect x="230" y="150" width="230" height="150" rx="12" class="box"/>
<text x="345" y="182" text-anchor="middle" class="mono" font-size="16" font-weight="bold">IntakeSubsystem</text>
<text x="345" y="206" text-anchor="middle" font-size="15" class="muted">一个文件</text>
<g class="chip servo"><rect x="260" y="222" width="170" height="26" rx="13"/><text x="345" y="240">继承 servo：臂</text></g>
<g class="chip roller"><rect x="260" y="258" width="170" height="26" rx="13"/><text x="345" y="276">+ 2 个滚轮</text></g>

<!-- Hopper -->
<rect x="480" y="150" width="200" height="150" rx="12" class="box"/>
<text x="580" y="182" text-anchor="middle" class="mono" font-size="16" font-weight="bold">HopperSubsystem</text>
<text x="580" y="206" text-anchor="middle" font-size="15" class="muted">一个文件</text>
<g class="chip roller"><rect x="505" y="222" width="150" height="26" rx="13"/><text x="580" y="240">继承 roller</text></g>
<g class="chip roller"><rect x="505" y="258" width="150" height="26" rx="13"/><text x="580" y="276">+ 3 个滚轮</text></g>

<!-- Shooter -->
<rect x="700" y="150" width="360" height="150" rx="12" class="box"/>
<text x="880" y="182" text-anchor="middle" class="mono" font-size="16" font-weight="bold">ShooterSubsystem</text>
<text x="880" y="206" text-anchor="middle" font-size="15" class="muted">组合调角板和飞轮</text>
<g class="chip plain"><rect x="750" y="222" width="260" height="26" rx="13"/><text x="880" y="240">继承 SubsystemBase · 没有电机</text></g>

<line x1="780" y1="302" x2="780" y2="334" stroke="#8796a5" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-light)"/>
<line x1="970" y1="302" x2="970" y2="334" stroke="#8796a5" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-light)"/>
<text x="875" y="324" text-anchor="middle" class="mono muted" font-size="15">setWantedState()</text>

<!-- Hood -->
<rect x="700" y="340" width="160" height="110" rx="12" class="box"/>
<text x="780" y="372" text-anchor="middle" class="mono" font-size="15" font-weight="bold">HoodSubsystem</text>
<text x="780" y="395" text-anchor="middle" font-size="15" class="muted">射击角度</text>
<g class="chip servo"><rect x="715" y="410" width="130" height="26" rx="13"/><text x="780" y="428">继承 servo</text></g>

<!-- Flywheel -->
<rect x="880" y="340" width="180" height="110" rx="12" class="box"/>
<text x="970" y="372" text-anchor="middle" class="mono" font-size="15" font-weight="bold">FlywheelSubsystem</text>
<text x="970" y="395" text-anchor="middle" font-size="15" class="muted">射击速度</text>
<g class="chip roller"><rect x="895" y="410" width="150" height="26" rx="13"/><text x="970" y="428">roller + 从动电机</text></g>

<!-- Legend -->
<text x="40" y="364" class="label">基类</text>
<g class="chip servo"><rect x="40" y="380" width="90" height="26" rx="13"/><text x="85" y="398">servo</text></g>
<text x="145" y="398" font-size="15"><tspan class="mono" font-size="14">ServoMotorSubsystem</tspan>：在最小和最大位置之间移动到某个位置</text>
<g class="chip roller"><rect x="40" y="416" width="90" height="26" rx="13"/><text x="85" y="434">roller</text></g>
<text x="145" y="434" font-size="15"><tspan class="mono" font-size="14">RollerMotorSubsystem</tspan>：旋转，没有最小或最大位置</text>
</svg>
