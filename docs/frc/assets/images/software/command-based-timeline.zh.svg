<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 445" width="1100" height="445">
<style>
text { font-family: Roboto, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", Helvetica, Arial, sans-serif; fill: #1f2a33; }
.mono, .mono text { font-family: "Roboto Mono", Consolas, Menlo, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", monospace; }
.muted, .muted text { fill: #5b6770; }
.row { font-size: 19px; font-weight: bold; }
.grid { stroke: #e3e9ee; stroke-width: 1.5; }
.step { fill: #eef4fc; stroke: #9dbbe0; stroke-width: 1.5; }
</style>
<rect width="1100" height="445" rx="16" fill="#ffffff"/>

<!-- Loops: 11 columns, 75 px each, starting at x = 230 -->
<text x="1055" y="34" text-anchor="end" font-size="16" class="muted">1 个循环 = 20 ms</text>
<text x="40" y="63" class="row">循环</text>
<g font-size="17" text-anchor="middle" class="muted">
<text x="267.5" y="63">1</text><text x="342.5" y="63">2</text><text x="417.5" y="63">3</text>
<text x="492.5" y="63">4</text><text x="567.5" y="63">5</text><text x="642.5" y="63">6</text>
<text x="717.5" y="63">7</text><text x="792.5" y="63">8</text><text x="867.5" y="63">9</text>
<text x="942.5" y="63">10</text><text x="1017.5" y="63">11</text>
</g>
<g class="grid">
<line x1="230" y1="74" x2="230" y2="300"/><line x1="305" y1="74" x2="305" y2="300"/>
<line x1="380" y1="74" x2="380" y2="300"/><line x1="455" y1="74" x2="455" y2="300"/>
<line x1="530" y1="74" x2="530" y2="300"/><line x1="605" y1="74" x2="605" y2="300"/>
<line x1="680" y1="74" x2="680" y2="300"/><line x1="755" y1="74" x2="755" y2="300"/>
<line x1="830" y1="74" x2="830" y2="300"/><line x1="905" y1="74" x2="905" y2="300"/>
<line x1="980" y1="74" x2="980" y2="300"/><line x1="1055" y1="74" x2="1055" y2="300"/>
</g>

<!-- Row 1: the A button -->
<text x="40" y="117" class="row">A 按钮</text>
<polyline points="230,128 455,128 455,92 830,92 830,128 1055,128" fill="none" stroke="#2e9d43" stroke-width="4" stroke-linejoin="round"/>
<g font-size="16" text-anchor="middle" class="muted">
<text x="342.5" y="120">松开</text>
<text x="642.5" y="119">按住</text>
<text x="942.5" y="120">松开</text>
</g>

<!-- Row 2: which command has the Intake -->
<text x="40" y="187" class="row">谁在用 Intake</text>
<rect x="232" y="160" width="221" height="40" rx="6" fill="#e0f2e4" stroke="#2e9d43" stroke-width="1.5"/>
<text x="342.5" y="186" text-anchor="middle" font-size="18"><tspan class="mono" font-weight="bold">stop()</tspan><tspan class="muted"> 默认</tspan></text>
<rect x="457" y="160" width="371" height="40" rx="6" fill="#dfeafb" stroke="#2f6fb5" stroke-width="1.5"/>
<text x="642.5" y="186" text-anchor="middle" class="mono" font-size="18" font-weight="bold">runIn()</text>
<rect x="832" y="160" width="221" height="40" rx="6" fill="#e0f2e4" stroke="#2e9d43" stroke-width="1.5"/>
<text x="942.5" y="186" text-anchor="middle" font-size="18"><tspan class="mono" font-weight="bold">stop()</tspan><tspan class="muted"> 默认</tspan></text>

<!-- Row 3: which parts of runIn() the scheduler calls -->
<text x="40" y="262" class="row">runIn() 内部</text>
<rect x="459" y="224" width="67" height="62" rx="6" class="step"/>
<rect x="534" y="224" width="67" height="62" rx="6" class="step"/>
<rect x="609" y="224" width="67" height="62" rx="6" class="step"/>
<rect x="684" y="224" width="67" height="62" rx="6" class="step"/>
<rect x="759" y="224" width="67" height="62" rx="6" class="step"/>
<rect x="834" y="224" width="67" height="62" rx="6" class="step"/>
<g font-size="15" text-anchor="middle">
<text x="492.5" y="250">initialize</text><text x="492.5" y="271">execute</text>
<text x="567.5" y="260">execute</text>
<text x="642.5" y="260">execute</text>
<text x="717.5" y="260">execute</text>
<text x="792.5" y="260">execute</text>
<text x="867.5" y="260">end</text>
</g>

<!-- What happens -->
<line x1="455" y1="78" x2="455" y2="318" stroke="#1f2a33" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="830" y1="78" x2="830" y2="318" stroke="#1f2a33" stroke-width="2" stroke-dasharray="6 5"/>
<text x="40" y="348" class="row">发生了什么</text>
<g font-size="17">
<text x="238" y="348"><tspan font-weight="bold">第 1–3 个循环：</tspan>没有命令</text>
<text x="238" y="371">需要 Intake，所以它的</text>
<text x="238" y="394">默认命令 <tspan class="mono">stop()</tspan> 运行。</text>

<text x="463" y="348"><tspan font-weight="bold">第 4 个循环：</tspan>调度器发现 A 被按住，</text>
<text x="463" y="371">于是启动 <tspan class="mono">runIn()</tspan>。它需要 Intake，</text>
<text x="463" y="394">所以先打断 <tspan class="mono">stop()</tspan>。</text>

<text x="838" y="348"><tspan font-weight="bold">第 9 个循环：</tspan>A 松开了，</text>
<text x="838" y="371">于是 <tspan class="mono">whileTrue</tspan> 取消</text>
<text x="838" y="394"><tspan class="mono">runIn()</tspan>。Intake 空闲了，</text>
<text x="838" y="417"><tspan class="mono">stop()</tspan> 启动。</text>
</g>
</svg>
