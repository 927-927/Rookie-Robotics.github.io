<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 376" width="1100" height="376">
<defs>
<marker id="move" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#e8710a"/>
</marker>
<!-- the hopper, the feeder lane and the flywheel, without fuel -->
<g id="hopper">
<path d="M30,10 V130 H272 M190,10 V98 H258" fill="none" stroke="#1f2a33" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="282" cy="86" r="18" fill="#ffffff" stroke="#1f2a33" stroke-width="3"/>
<circle cx="282" cy="86" r="4" fill="#5b6770"/>
<rect x="33" y="56" width="14" height="16" rx="2" fill="#37474f"/>
<rect x="226" y="133" width="18" height="12" rx="2" fill="#37474f"/>
</g>
<!-- one row of fuel on the hopper floor -->
<g id="row1">
<circle cx="44" cy="117" r="13"/><circle cx="70" cy="117" r="13"/><circle cx="96" cy="117" r="13"/>
<circle cx="122" cy="117" r="13"/><circle cx="148" cy="117" r="13"/><circle cx="174" cy="117" r="13"/>
</g>
<g id="row2">
<circle cx="57" cy="93" r="13"/><circle cx="83" cy="93" r="13"/><circle cx="109" cy="93" r="13"/>
<circle cx="135" cy="93" r="13"/><circle cx="161" cy="93" r="13"/>
</g>
<g id="row3">
<circle cx="70" cy="69" r="13"/><circle cx="96" cy="69" r="13"/><circle cx="122" cy="69" r="13"/>
<circle cx="148" cy="69" r="13"/><circle cx="174" cy="69" r="13"/>
</g>
</defs>
<style>
text { font-family: Roboto, Helvetica, Arial, sans-serif; fill: #1f2a33; }
.mono, .mono text { font-family: "Roboto Mono", Consolas, Menlo, monospace; }
.muted, .muted text { fill: #5b6770; }
.panel { fill: #f5f7f8; stroke: #cfd8dc; stroke-width: 2; }
.fuel { fill: #ffd54f; stroke: #c9a400; stroke-width: 2; }
.clear { stroke: #b0bec5; stroke-width: 2; stroke-dasharray: 4 5; }
.led-off { fill: #90a4ae; }
.led-on { fill: #ff9800; }
.hit { stroke: #ff9800; stroke-width: 3; }
.wanted rect { fill: #fff6d6; stroke: #c9a400; stroke-width: 1.5; }
.wanted text { fill: #8a6d00; font-size: 15px; font-weight: bold; text-anchor: middle; }
.condition { font-size: 15px; text-anchor: middle; fill: #5b6770; }
.small { font-size: 12px; fill: #5b6770; }
.state text { font-size: 15px; font-weight: bold; text-anchor: middle; }
.state-off rect { fill: #eceff1; stroke: #90a4ae; stroke-width: 1.5; }
.state-off text { fill: #455a64; }
.state-on rect { fill: #e0f2e4; stroke: #2e9d43; stroke-width: 1.5; }
.state-on text { fill: #1b6a2b; }
.caption { font-size: 15px; text-anchor: middle; fill: #5b6770; }
</style>
<rect width="1100" height="376" rx="16" fill="#ffffff"/>

<!-- ============ DEFAULT, hopper not full ============ -->
<g transform="translate(40,28)">
<rect width="320" height="320" rx="12" class="panel"/>
<g class="wanted mono"><rect x="65" y="16" width="190" height="30" rx="15"/><text x="160" y="36">wanted: DEFAULT</text></g>
<text x="160" y="70" class="condition">hopper not full</text>
<g transform="translate(0,80)">
<use href="#hopper"/>
<g class="fuel"><use href="#row1"/></g>
<line x1="47" y1="64" x2="188" y2="64" class="clear"/>
<circle cx="40" cy="64" r="3" class="led-off"/>
<line x1="235" y1="130" x2="235" y2="100" class="clear"/>
<circle cx="235" cy="139" r="3" class="led-off"/>
<text x="54" y="52" class="small">hopper sensor</text>
<text x="235" y="160" text-anchor="middle" class="small">feeder sensor</text>
</g>
<g class="state state-off mono"><rect x="70" y="250" width="180" height="30" rx="15"/><text x="160" y="270">OFF · 0 %</text></g>
<text x="160" y="304" class="caption">nothing to do</text>
</g>

<!-- ============ DEFAULT, hopper full, feeder empty ============ -->
<g transform="translate(390,28)">
<rect width="320" height="320" rx="12" class="panel"/>
<g class="wanted mono"><rect x="65" y="16" width="190" height="30" rx="15"/><text x="160" y="36">wanted: DEFAULT</text></g>
<text x="160" y="70" class="condition">hopper full, feeder empty</text>
<g transform="translate(0,80)">
<use href="#hopper"/>
<g class="fuel"><use href="#row1"/><use href="#row2"/><use href="#row3"/><circle cx="204" cy="117" r="13"/></g>
<line x1="47" y1="64" x2="56" y2="64" class="hit"/>
<circle cx="40" cy="64" r="3" class="led-on"/>
<line x1="235" y1="130" x2="235" y2="100" class="clear"/>
<circle cx="235" cy="139" r="3" class="led-off"/>
<line x1="219" y1="117" x2="228" y2="117" stroke="#e8710a" stroke-width="3" marker-end="url(#move)"/>
</g>
<g class="state state-on mono"><rect x="60" y="250" width="200" height="30" rx="15"/><text x="160" y="270">PRELOADING · 7 %</text></g>
<text x="160" y="304" class="caption">moves fuel up to the feeder, slowly</text>
</g>

<!-- ============ SHOOT ============ -->
<g transform="translate(740,28)">
<rect width="320" height="320" rx="12" class="panel"/>
<g class="wanted mono"><rect x="65" y="16" width="190" height="30" rx="15"/><text x="160" y="36">wanted: SHOOT</text></g>
<text x="160" y="70" class="condition">the sensors don't matter</text>
<g transform="translate(0,80)">
<use href="#hopper"/>
<g class="fuel"><use href="#row1"/><use href="#row2"/><circle cx="204" cy="117" r="13"/><circle cx="235" cy="117" r="13"/><circle cx="302" cy="44" r="11"/></g>
<line x1="47" y1="64" x2="188" y2="64" class="clear"/>
<circle cx="40" cy="64" r="3" class="led-off"/>
<line x1="235" y1="133" x2="235" y2="131" class="hit"/>
<circle cx="235" cy="139" r="3" class="led-on"/>
<line x1="252" y1="117" x2="266" y2="117" stroke="#e8710a" stroke-width="4" marker-end="url(#move)"/>
<g stroke="#c9a400" stroke-width="3" stroke-linecap="round">
<line x1="288" y1="60" x2="281" y2="67"/>
<line x1="296" y1="64" x2="290" y2="71"/>
</g>
</g>
<g class="state state-on mono"><rect x="60" y="250" width="200" height="30" rx="15"/><text x="160" y="270">SHOOTING · 100 %</text></g>
<text x="160" y="304" class="caption">feeds the shooter at full power</text>
</g>
</svg>
