site_name: RookieRobotics
site_url: https://927-927.github.io/Rookie-Robotics.github.io/
repo_url: https://github.com/927-927/Rookie-Robotics.github.io
repo_name: 927-927/Rookie-Robotics.github.io

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# Styles and the sidebar toggle come from the synced FRC docs, so changes to
# them in 927-927.github.io show up here too.
extra_css:
  - frc/stylesheets/extra.css

extra_javascript:
  - frc/javascripts/sidebar-toggle.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - FTC:
      - ftc/index.md
  # >>> FRC nav (generated by scripts/sync_frc.py from 927-927.github.io, don't edit by hand)
  - FRC:
      - frc/index.md
      - Hardware:
          - frc/hardware/index.md
      - Electronics:
          - frc/electronics/index.md
          - Power wiring: frc/electronics/power-wiring.md
          - Signal wiring: frc/electronics/signal-wiring.md
          - Tools: frc/electronics/tools.md
          - Connectors: frc/electronics/connectors.md
          - Wire terminals: frc/electronics/wire-terminals.md
      - Software:
          - frc/software/index.md
  # <<< FRC nav
