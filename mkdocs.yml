site_name: RookieRobotics
site_url: https://927-927.github.io/Rookie-Robotics.github.io/
repo_url: https://github.com/927-927/Rookie-Robotics.github.io
repo_name: 927-927/Rookie-Robotics.github.io

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  # English stays at /, Chinese is built at /zh/. A page's Chinese version sits
  # next to it with a .zh suffix (index.md -> index.zh.md); pages without one
  # show the English text on the Chinese site. Carried over from
  # 927-927.github.io, which writes the FRC .zh.md pages.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: en
          name: English
          default: true
        - locale: zh
          name: 中文
          # Chinese titles for the nav entries, keyed by their English title.
          # The FRC ones come from 927-927.github.io's mkdocs.yml; terms follow
          # its translation-glossary.md.
          nav_translations:
            Home: 首页
            Hardware: 硬件
            Common devices: 常用设备
            Components: 零部件
            Electronics: 电控
            Power wiring: 电源接线
            Signal wiring: 信号接线
            Tools: 工具
            Connectors: 连接器
            Wire terminals: 线端端子
            Troubleshooting: 故障排查
            Software: 软件
            Java basics: Java 基础
            Command-based skeleton: 基于命令的基本结构
            Time-based to command-based: 从基于时间到基于命令
            Complex command-based: 进阶基于命令编程
            Command-based styles: 各队的基于命令风格
            Team 2910: 2910 队
            Team 1678: 1678 队
            Team 8214: 8214 队

# Styles and scripts come from the synced FRC docs, so changes to them in
# 927-927.github.io show up here too. New files still need adding here.
extra_css:
  - frc/stylesheets/extra.css

extra_javascript:
  - frc/javascripts/sidebar-toggle.js
  - frc/javascripts/code-window.js
  - frc/javascripts/can-sim.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - FTC:
      - ftc/index.md
  # >>> FRC nav (generated by scripts/sync_frc.py from 927-927.github.io, don't edit by hand)
  - FRC:
      - frc/index.md
      - Hardware:
          - frc/hardware/index.md
          - CAD: frc/hardware/cad.md
          - Common devices: frc/hardware/devices.md
          - Components: frc/hardware/components.md
      - Electronics:
          - frc/electronics/index.md
          - Power wiring: frc/electronics/power-wiring.md
          - Signal wiring: frc/electronics/signal-wiring.md
          - Tools: frc/electronics/tools.md
          - Connectors: frc/electronics/connectors.md
          - Wire terminals: frc/electronics/wire-terminals.md
          - Troubleshooting: frc/electronics/troubleshooting.md
      - Software:
          - frc/software/index.md
          - Java basics: frc/software/java-basics.md
          - Command-based skeleton: frc/software/command-based-skeleton.md
          - Time-based to command-based: frc/software/time-based-to-command-based.md
          - Complex command-based: frc/software/complex-command-based.md
          - Command-based styles:
              - frc/software/command-based-styles/index.md
              - Team 2910: frc/software/command-based-styles/team-2910.md
              - Team 1678: frc/software/command-based-styles/team-1678.md
              - Team 8214: "/Rookie-Robotics.github.io/frc/software/command-based-styles/#team-8214"
  # <<< FRC nav
