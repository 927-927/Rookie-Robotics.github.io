name: Sync FRC docs and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Sent by 927-927.github.io right after it deploys (see README), so updates show up within minutes
  repository_dispatch:
    types: [frc-docs-updated]
  # Fallback: check 927-927.github.io for changes every hour
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FRC_SOURCE_REPO: 927-927/927-927.github.io

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.FRC_SOURCE_REPO }}
          path: .frc-source
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/sync_frc.py .frc-source

      - name: Commit synced FRC docs
        id: sync
        run: |
          if [ -z "$(git status --porcelain -- docs/frc mkdocs.yml)" ]; then
            echo "FRC docs already up to date"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/frc mkdocs.yml
          git commit -m "Sync FRC docs from $FRC_SOURCE_REPO@$(git -C .frc-source rev-parse --short HEAD)"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Scheduled runs only redeploy when the FRC docs actually changed
      - name: Decide whether to deploy
        id: decide
        run: echo "deploy=${{ github.event_name != 'schedule' || steps.sync.outputs.changed == 'true' }}" >> "$GITHUB_OUTPUT"

      - if: steps.decide.outputs.deploy == 'true'
        run: mkdocs build --strict
      - if: steps.decide.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
